services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    env_file: ../.env
    environment:
      API_PORT: 3001
      DATABASE_URL: postgresql://document_user:document_password@postgres:5432/document_automation?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_CREATE_BUCKET: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "3001:3001"

  validum:
    build:
      context: ..
      dockerfile: deploy/validum.Dockerfile
    ports:
      - "8080:80"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: document_automation
      POSTGRES_USER: document_user
      POSTGRES_PASSWORD: document_password
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_user -d document_automation"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - ../data/redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - ../data/minio:/data
    ports:
      - "9001:9001"
